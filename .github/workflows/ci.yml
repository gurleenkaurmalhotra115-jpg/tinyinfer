name: tinyinfer CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  numerical-parity-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies (CPU)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install --no-deps -e .

      - name: Cache GPT-2 weights
        id: cache-weights
        uses: actions/cache@v4
        with:
          path: models/gpt2
          key: gpt2-safetensors-v1

      - name: Download GPT-2 safetensors weights
        if: steps.cache-weights.outputs.cache-hit != 'true'
        run: python download_weights.py

      - name: Run unit test suite (22 tests)
        run: pytest tests/ -v
